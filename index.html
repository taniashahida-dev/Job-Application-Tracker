<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Tracker</title>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- CSS link -->
    <link rel="stylesheet" href="./tailwind.init.css" />
    <!-- Tailwind link -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-200">
    <header class="w-10/12 mx-auto mt-10">
      <h1 class="text-3xl lg:text-5xl font-bold ">Job Application Tracker</h1>
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-white p-5 my-5 rounded-lg "><p>Total</p>    <p class="font-bold text-3xl ">0</p></div>
        <div class="bg-white p-5 my-5 rounded-lg "><p>Interview</p><p class="font-bold text-3xl text-green-700 ">0</p> </div>
        <div class="bg-white p-5 my-5 rounded-lg "><p>Rejected</p> <p class="font-bold text-3xl text-red-700">0</p></div>
      </div> 
    </header>
      
    <main class="w-10/12 mx-auto mt-10"> 
        <section class="space-y-2.5">
            <div class="flex justify-between">
                <h2 class="font-bold text-2xl">Available Jobs</h2>
                <p><span>0</span>Jobs</p>
            </div>
            <div >
                <button class="py-1 px-5 mr-3 rounded-lg bg-blue-700 text-white ">All</button>
                <button class="py-1 px-5 mr-3 rounded-lg bg-white ">Interview</button>
                <button class="py-1 px-5 mt-2.5 lg:mr-3 rounded-lg bg-white ">Rejected</button>
            </div>
        </section>


        <section>


        </section>
    </main>


    <script src="./script.js"></script>
  </body>
</html>
